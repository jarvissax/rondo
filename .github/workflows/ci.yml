# Checks the versions, tests the server and builds the update page on every push to a branch and every
# pull request (a release's tag points at a commit already checked on main: release.yml and
# server-release.yml check it again their own way). Runners are pinned to an Ubuntu release (not
# ubuntu-latest) so a new image arrives on purpose, not by itself.
name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  # each component's files agree on its version: the device's (Rondo, the update page) and the
  # server's, released apart (tools/set-version.sh)
  versions:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - run: tools/set-version.sh --check

  server:
    runs-on: ubuntu-26.04
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  web-updater:
    runs-on: ubuntu-26.04
    defaults:
      run:
        working-directory: web-updater
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web-updater/package-lock.json
      - run: npm ci
      - run: npm run build
