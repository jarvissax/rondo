# Builds the app and the update page, and tests the server, on every push and pull request. Runners
# are pinned to an Ubuntu release (not ubuntu-latest) so a new image arrives on purpose, not by itself.
name: CI

on:
  push:
  pull_request:

jobs:
  # the app, the server and the update page share one version (tools/set-version.sh)
  versions:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - run: tools/set-version.sh --check

  server:
    runs-on: ubuntu-26.04
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  app:
    runs-on: ubuntu-26.04
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7
      # Gradle's own downloads cached by setup-java (gradle/actions v6+ made its caching closed source)
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
      # the runner comes with the Android SDK (ANDROID_HOME); Gradle fetches the platform it needs
      - run: ./gradlew :app:assembleDebug
      - uses: actions/upload-artifact@v7
        with:
          name: rondo-debug-apk
          path: app/app/build/outputs/apk/debug/app-debug.apk

  web-updater:
    runs-on: ubuntu-26.04
    defaults:
      run:
        working-directory: web-updater
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web-updater/package-lock.json
      - run: npm ci
      - run: npm run build
