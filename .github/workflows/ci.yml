# Builds the app and the update page, and tests the server, on every push and pull request.
name: CI

on:
  push:
  pull_request:

jobs:
  # the app, the server and the update page share one version (tools/set-version.sh)
  versions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: tools/set-version.sh --check

  server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  app:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      # the runner comes with the Android SDK (ANDROID_HOME); Gradle fetches the platform it needs
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: rondo-debug-apk
          path: app/app/build/outputs/apk/debug/app-debug.apk

  web-updater:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web-updater
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web-updater/package-lock.json
      - run: npm ci
      - run: npm run build
