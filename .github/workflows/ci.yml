# Checks the versions, tests the server and builds the update page on every push and pull request. Runners
# are pinned to an Ubuntu release (not ubuntu-latest) so a new image arrives on purpose, not by itself.
name: CI

on:
  push:
  pull_request:

jobs:
  # Rondo, the server and the update page share one version (tools/set-version.sh)
  versions:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - run: tools/set-version.sh --check

  server:
    runs-on: ubuntu-26.04
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  web-updater:
    runs-on: ubuntu-26.04
    defaults:
      run:
        working-directory: web-updater
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web-updater/package-lock.json
      - run: npm ci
      - run: npm run build
