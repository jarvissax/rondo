# Publishes the web installer (web-installer/) on GitHub Pages, with the latest release's APK next
# to it, whenever a release is published, or by hand from the Actions tab. Pages must be set to
# "GitHub Actions" in the repository's settings (Settings > Pages > Source).
name: Web installer

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    defaults:
      run:
        working-directory: web-installer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web-installer/package-lock.json
      - run: npm ci
      - run: npm run build
      - name: Add the latest release's APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName)
          gh release download "$tag" --repo "$GITHUB_REPOSITORY" --pattern 'rondo-*.apk' --dir apk
          apk=$(ls apk/rondo-*.apk | head -1)
          cp "$apk" dist/rondo.apk
          printf '{"version":"%s","file":"rondo.apk","size":%s}\n' "${tag#v}" "$(stat -c %s "$apk")" > dist/latest.json
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web-installer/dist
      - id: deploy
        uses: actions/deploy-pages@v4
