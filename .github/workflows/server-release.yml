# Releases the Rondo server when its tag is pushed (server-v<version>), or a tag named by hand from the
# Actions tab. Rondo on the Y1 has its own releases (tags v<version>: release.yml), and each release
# starts one workflow: this one creates the server's GitHub release itself, with the workflow's own
# token, and GitHub starts no other workflow for a release made that way.
#
# 1. checks that the tag and the server's version (tools/set-version.sh --check server) agree, that
#    server/CHANGELOG.md has the version's section, and runs the server's tests;
# 2. builds the server's image and its updater's (infra/Dockerfile, infra/updater.Dockerfile) for
#    x86-64 and 64-bit ARM and publishes them on GitHub's registry as <version> and latest, which
#    the compose files run and the admin page's Update installs;
# 3. publishes the GitHub release, with that section as its notes and no assets, not marked latest
#    (Rondo's is, and Innioasis Updater CE lists only releases with a rom.zip). The admin page hears
#    of it from GitHub's list (server/src/updates.ts) once the images are out.
name: Server release

on:
  push:
    tags: ["server-v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "The tag, server-v<version>"
        required: true

concurrency:
  group: server-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-26.04
    permissions:
      contents: write
      packages: write
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref_name }}
      - name: Version agrees
        run: tools/set-version.sh --check server "${TAG#server-v}"
      - name: Notes from server/CHANGELOG.md
        run: |
          version="${TAG#server-v}"
          # the version's section, without its heading
          awk -v h="## $version " 'index($0, h) == 1 {on = 1; next} on && /^## / {exit} on' server/CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          grep -q '[^[:space:]]' "$RUNNER_TEMP/notes.md" || { echo "::error::server/CHANGELOG.md has no '## $version' section"; exit 1; }
          cat "$RUNNER_TEMP/notes.md"
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - name: Tests
        working-directory: server
        run: |
          npm ci
          npm run typecheck
          npm test
      - name: Names and version
        id: names
        run: |
          echo "version=${TAG#server-v}" >> "$GITHUB_OUTPUT"
          echo "registry=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: The server
        uses: docker/build-push-action@v7
        with:
          context: .
          file: infra/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ steps.names.outputs.registry }}/rondo-server:${{ steps.names.outputs.version }}
            ${{ steps.names.outputs.registry }}/rondo-server:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.names.outputs.version }}
            org.opencontainers.image.title=Rondo server
            org.opencontainers.image.description=Streams YouTube Music and YouTube to a Rondo on the Innioasis Y1
            org.opencontainers.image.licenses=MIT
          cache-from: type=gha,scope=server
          cache-to: type=gha,scope=server,mode=max
      - name: The updater
        uses: docker/build-push-action@v7
        with:
          context: .
          file: infra/updater.Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ steps.names.outputs.registry }}/rondo-updater:${{ steps.names.outputs.version }}
            ${{ steps.names.outputs.registry }}/rondo-updater:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.names.outputs.version }}
            org.opencontainers.image.title=Rondo updater
            org.opencontainers.image.description=Updates a Rondo server container from its admin page
            org.opencontainers.image.licenses=MIT
          cache-from: type=gha,scope=updater
          cache-to: type=gha,scope=updater,mode=max
      - name: The release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${TAG#server-v}"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "Rondo server $version is out already"
          else
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --latest=false \
              --title "Rondo server $version" --notes-file "$RUNNER_TEMP/notes.md"
          fi
