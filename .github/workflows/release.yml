# Finishes a release once it's published (or the latest one again, by hand from the Actions tab):
#
# 1. checks that its tag, the project's versions (tools/set-version.sh) and its Rondo agree: Rondo
#    2.0's rondo-<version>.rondo (its VERSION, and its signature against the bundle key's public half
#    in native/core/bundle.h), or 1.0.x's rondo-<version>.apk (the APK's firmware number included);
# 2. builds the firmware from it with firmware/build.sh and attaches it as rom.zip, the file
#    Innioasis Updater CE installs, with updater.png, its picture;
# 3. builds the server's image and its updater's (infra/Dockerfile, infra/updater.Dockerfile) for
#    x86-64 and 64-bit ARM and publishes them on GitHub's registry as <version> and latest, which
#    the compose files run and the admin page's Update installs;
# 4. publishes the update page (web-updater/) on GitHub Pages with the APK as rondo.apk and
#    latest.json, which the Rondo (through its server), the dashboard and the update page read.
#
# So a release reaches Rondos and servers only once its rom.zip and images are out. The APK is built and signed on the
# developer's machine and attached by hand (docs/building.md): the signing key never comes here.
# Pages must be set to "GitHub Actions" (Settings > Pages > Source), and the github-pages
# environment must allow tags v* (release runs use the tag).
name: Release

on:
  release:
    types: [published]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  firmware:
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.release.outputs.tag }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Which release
        id: release
        env:
          EVENT_TAG: ${{ github.event.release.tag_name }}
        run: |
          tag="${EVENT_TAG:-$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName)}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Release $tag"
      - uses: actions/checkout@v7
        with:
          ref: ${{ steps.release.outputs.tag }}
      - name: The release's Rondo (2.0's signed bundle, or 1.0.x's APK)
        id: file
        env:
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          if gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern "rondo-${TAG#v}.rondo" --dir release; then
            echo "file=release/rondo-${TAG#v}.rondo" >> "$GITHUB_OUTPUT"
          else
            gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern "rondo-${TAG#v}.apk" --dir release
            echo "file=release/rondo-${TAG#v}.apk" >> "$GITHUB_OUTPUT"
          fi
      - name: Versions agree (bundle)
        if: endsWith(steps.file.outputs.file, '.rondo')
        env:
          TAG: ${{ steps.release.outputs.tag }}
          FILE: ${{ steps.file.outputs.file }}
        run: |
          version="${TAG#v}"
          tools/set-version.sh --check "$version"
          inside="$(tail -c +73 "$FILE" | tar -xzOf - ./VERSION)"
          [ "$inside" = "$version" ] || { echo "::error::The bundle is Rondo $inside, not $version"; exit 1; }
          # signed with the bundle key (its public half is in native/core/bundle.h)
          node -e '
            const fs = require("fs"), crypto = require("crypto");
            const hex = fs.readFileSync("native/core/bundle.h", "utf8").match(/kPublicKey\[32\] = \{([^}]*)\}/)[1].match(/0x[0-9a-f]{2}/g).map((h) => h.slice(2)).join("");
            const der = Buffer.concat([Buffer.from("302a300506032b6570032100", "hex"), Buffer.from(hex, "hex")]);
            const key = crypto.createPublicKey({ key: der, format: "der", type: "spki" });
            const b = fs.readFileSync(process.argv[1]);
            if (b.subarray(0, 8).toString() !== "RONDOB1\n") throw new Error("not a Rondo bundle");
            const digest = crypto.createHash("sha256").update(b.subarray(72)).digest();
            if (!crypto.verify(null, digest, key, b.subarray(8, 72))) throw new Error("the bundle is not signed with the bundle key");
            console.log("signed with the bundle key");
          ' "$FILE"
          echo "Rondo $version, firmware $(sed -n 's/.*kFirmwareNeeded = \([0-9][0-9]*\).*/\1/p' native/core/version.h)"
      - name: Versions agree (APK)
        if: endsWith(steps.file.outputs.file, '.apk')
        env:
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          version="${TAG#v}"
          tools/set-version.sh --check "$version"
          aapt="$(ls "$ANDROID_HOME"/build-tools/*/aapt | sort -V | tail -1)"
          apk="release/rondo-$version.apk"
          name="$("$aapt" dump badging "$apk" | sed -n "s/.*versionName='\([^']*\)'.*/\1/p")"
          [ "$name" = "$version" ] || { echo "::error::The APK is Rondo $name, not $version"; exit 1; }
          # android:value="1" is stored as an integer, (type 0x10)0x1
          needs="$("$aapt" dump xmltree "$apk" AndroidManifest.xml | grep -A1 '"rondo.firmware"' | sed -n 's/.*android:value([^)]*)=(type 0x10)0x\([0-9a-f]*\).*/\1/p')"
          level="$(sed -n 's/^val firmwareLevel = \([0-9][0-9]*\).*/\1/p' app/app/build.gradle.kts)"
          [ -n "$needs" ] && [ "$((16#$needs))" = "$level" ] || { echo "::error::The APK names firmware '$needs', build.gradle.kts $level"; exit 1; }
          echo "Rondo $version, firmware $level"
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - name: Tools for firmware/build.sh
        run: sudo apt-get install -y -q e2fsprogs zip unzip
      - name: Build the firmware
        env:
          FILE: ${{ steps.file.outputs.file }}
        run: firmware/build.sh "$FILE" "$PWD/release/rom.zip"
      - name: Attach rom.zip and updater.png
        env:
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          cp firmware/updater.png release/updater.png
          gh release upload "$TAG" release/rom.zip release/updater.png --repo "$GITHUB_REPOSITORY" --clobber

  server-images:
    needs: firmware
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      packages: write
    env:
      TAG: ${{ needs.firmware.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.firmware.outputs.tag }}
      - name: Names and version
        id: names
        run: |
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
          echo "registry=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: The server
        uses: docker/build-push-action@v7
        with:
          context: .
          file: infra/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ steps.names.outputs.registry }}/rondo-server:${{ steps.names.outputs.version }}
            ${{ steps.names.outputs.registry }}/rondo-server:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.names.outputs.version }}
            org.opencontainers.image.title=Rondo server
            org.opencontainers.image.description=Streams YouTube Music and YouTube to a Rondo on the Innioasis Y1
            org.opencontainers.image.licenses=MIT
          cache-from: type=gha,scope=server
          cache-to: type=gha,scope=server,mode=max
      - name: The updater
        uses: docker/build-push-action@v7
        with:
          context: .
          file: infra/updater.Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ steps.names.outputs.registry }}/rondo-updater:${{ steps.names.outputs.version }}
            ${{ steps.names.outputs.registry }}/rondo-updater:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.names.outputs.version }}
            org.opencontainers.image.title=Rondo updater
            org.opencontainers.image.description=Updates a Rondo server container from its admin page
            org.opencontainers.image.licenses=MIT
          cache-from: type=gha,scope=updater
          cache-to: type=gha,scope=updater,mode=max

  pages:
    needs: [firmware, server-images]
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ needs.firmware.outputs.tag }}
    defaults:
      run:
        working-directory: web-updater
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.firmware.outputs.tag }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web-updater/package-lock.json
      - run: npm ci
      - run: npm run build
      - name: The release's Rondo and latest.json
        run: |
          version="${TAG#v}"
          export VERSION="$version"
          export NOTES="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json url --jq .url)"
          export PUBLISHED="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json publishedAt --jq .publishedAt)"
          if gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern "rondo-$version.rondo" --dir apk; then
            # Rondo 2.0: the bundle, as rondo.rondo ("file" too: the dashboard and this page take it)
            cp "apk/rondo-$version.rondo" dist/rondo.rondo
            export SIZE="$(stat -c %s dist/rondo.rondo)"
            export FIRMWARE="$(sed -n 's/.*kFirmwareNeeded = \([0-9][0-9]*\).*/\1/p' ../native/core/version.h)"
            node -e 'const e = process.env; console.log(JSON.stringify({ version: e.VERSION, file: "rondo.rondo", size: Number(e.SIZE), bundle: "rondo.rondo", bundleSize: Number(e.SIZE), firmware: Number(e.FIRMWARE), notes: e.NOTES, published: e.PUBLISHED }))' > dist/latest.json
          else
            gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern "rondo-$version.apk" --dir apk
            cp "apk/rondo-$version.apk" dist/rondo.apk
            export SIZE="$(stat -c %s dist/rondo.apk)"
            export FIRMWARE="$(sed -n 's/^val firmwareLevel = \([0-9][0-9]*\).*/\1/p' ../app/app/build.gradle.kts)"
            node -e 'const e = process.env; console.log(JSON.stringify({ version: e.VERSION, file: "rondo.apk", size: Number(e.SIZE), firmware: Number(e.FIRMWARE), notes: e.NOTES, published: e.PUBLISHED }))' > dist/latest.json
          fi
          cat dist/latest.json
      - uses: actions/upload-pages-artifact@v5
        with:
          path: web-updater/dist
      - id: deploy
        uses: actions/deploy-pages@v5
