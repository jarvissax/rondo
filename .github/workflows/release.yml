# Finishes a release of Rondo on the Y1 (tag v<version>) once it's published, or the latest one again,
# by hand from the Actions tab. The server is released apart (tags server-v<version>:
# server-release.yml), so this one skips server releases.
#
# 1. checks that its tag, the device's versions (tools/set-version.sh --check device) and its Rondo
#    agree: rondo-<version>.rondo (its VERSION, and its signature against the bundle key's public
#    half in native/core/bundle.h);
# 2. builds the firmware from it with firmware/build.sh and attaches it as rom.zip, the file
#    Innioasis Updater CE installs, with updater.png, its picture;
# 3. publishes the update page (web-updater/) on GitHub Pages with the bundle as rondo.rondo and
#    latest.json, which the Rondo (directly or through its server), the dashboard and the update page
#    read.
#
# So a release reaches Rondos only once its rom.zip is out. The bundle is
# built and signed on the developer's machine and attached by hand (docs/building.md): the signing
# key never comes here.
# Pages must be set to "GitHub Actions" (Settings > Pages > Source), and the github-pages
# environment must allow tags v* (release runs use the tag).
name: Release

on:
  release:
    types: [published]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  firmware:
    # a server release (server-v…) is server-release.yml's
    if: ${{ github.event_name == 'workflow_dispatch' || startsWith(github.event.release.tag_name, 'v') }}
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.release.outputs.tag }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Which release
        id: release
        env:
          EVENT_TAG: ${{ github.event.release.tag_name }}
        run: |
          tag="${EVENT_TAG:-$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName)}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Release $tag"
      - uses: actions/checkout@v7
        with:
          ref: ${{ steps.release.outputs.tag }}
      - name: The release's Rondo (its signed bundle)
        id: file
        env:
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern "rondo-${TAG#v}.rondo" --dir release
          echo "file=release/rondo-${TAG#v}.rondo" >> "$GITHUB_OUTPUT"
      - name: Versions agree
        env:
          TAG: ${{ steps.release.outputs.tag }}
          FILE: ${{ steps.file.outputs.file }}
        run: |
          version="${TAG#v}"
          tools/set-version.sh --check device "$version"
          inside="$(tail -c +73 "$FILE" | tar -xzOf - ./VERSION)"
          [ "$inside" = "$version" ] || { echo "::error::The bundle is Rondo $inside, not $version"; exit 1; }
          # signed with the bundle key (its public half is in native/core/bundle.h)
          node -e '
            const fs = require("fs"), crypto = require("crypto");
            const hex = fs.readFileSync("native/core/bundle.h", "utf8").match(/kPublicKey\[32\] = \{([^}]*)\}/)[1].match(/0x[0-9a-f]{2}/g).map((h) => h.slice(2)).join("");
            const der = Buffer.concat([Buffer.from("302a300506032b6570032100", "hex"), Buffer.from(hex, "hex")]);
            const key = crypto.createPublicKey({ key: der, format: "der", type: "spki" });
            const b = fs.readFileSync(process.argv[1]);
            if (b.subarray(0, 8).toString() !== "RONDOB1\n") throw new Error("not a Rondo bundle");
            const digest = crypto.createHash("sha256").update(b.subarray(72)).digest();
            if (!crypto.verify(null, digest, key, b.subarray(8, 72))) throw new Error("the bundle is not signed with the bundle key");
            console.log("signed with the bundle key");
          ' "$FILE"
          echo "Rondo $version, firmware $(sed -n 's/.*kFirmwareNeeded = \([0-9][0-9]*\).*/\1/p' native/core/version.h)"
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - name: Tools for firmware/build.sh
        run: sudo apt-get install -y -q e2fsprogs zip unzip
      - name: Build the firmware
        env:
          FILE: ${{ steps.file.outputs.file }}
        run: firmware/build.sh "$FILE" "$PWD/release/rom.zip"
      - name: Attach rom.zip and updater.png
        env:
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          cp firmware/updater.png release/updater.png
          gh release upload "$TAG" release/rom.zip release/updater.png --repo "$GITHUB_REPOSITORY" --clobber

  pages:
    needs: firmware
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ needs.firmware.outputs.tag }}
    defaults:
      run:
        working-directory: web-updater
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.firmware.outputs.tag }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web-updater/package-lock.json
      - run: npm ci
      - run: npm run build
      - name: The release's Rondo and latest.json
        run: |
          version="${TAG#v}"
          export VERSION="$version"
          export NOTES="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json url --jq .url)"
          export PUBLISHED="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json publishedAt --jq .publishedAt)"
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern "rondo-$version.rondo" --dir bundle
          # the bundle, as rondo.rondo ("file" too: the dashboard and this page take it)
          cp "bundle/rondo-$version.rondo" dist/rondo.rondo
          export SIZE="$(stat -c %s dist/rondo.rondo)"
          export FIRMWARE="$(sed -n 's/.*kFirmwareNeeded = \([0-9][0-9]*\).*/\1/p' ../native/core/version.h)"
          node -e 'const e = process.env; console.log(JSON.stringify({ version: e.VERSION, file: "rondo.rondo", size: Number(e.SIZE), bundle: "rondo.rondo", bundleSize: Number(e.SIZE), firmware: Number(e.FIRMWARE), notes: e.NOTES, published: e.PUBLISHED }))' > dist/latest.json
          cat dist/latest.json
      - uses: actions/upload-pages-artifact@v5
        with:
          path: web-updater/dist
      - id: deploy
        uses: actions/deploy-pages@v5
